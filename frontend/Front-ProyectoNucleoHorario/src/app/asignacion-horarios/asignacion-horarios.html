<div class="layout-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="user-avatar-btn" title="Perfil Administrador">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>

    <nav class="sidebar-menu">
      <button type="button" class="sidebar-btn active" (click)="navegarA('/inicio-administrador')" title="Panel de control">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" title="Docentes">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M9 21v-2a4 4 0 0 1 4-4h1"></path>
          <circle cx="9" cy="7" r="4"></circle>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/gestion-bases-datos')" title="Gestión de bases de datos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
      </button>
    </nav>

    <div class="sidebar-corner-decor"></div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <div class="horarios-container">

      <!-- CABECERA -->
      <header class="horarios-header">
        <div class="header-title-box">
          <h1>Asignación de horarios</h1>
        </div>
        <div class="header-controls">
          <div class="week-navigator">
            <button class="nav-arrow-btn" title="Semana anterior">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="week-display">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              <span>12–16 de mayo, 2026</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <button class="nav-arrow-btn" title="Semana siguiente">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>

          <button type="button" class="btn-guardar-cambios" (click)="guardarCambios()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Guardar cambios
          </button>
        </div>
      </header>

      <div class="workspace-grid">

        <!-- PANEL IZQUIERDO: ASIGNATURAS ARRASTRABLES -->
        <div class="asignaturas-sidebar-panel">
          <h3>Asignaturas</h3>
          <div class="asignaturas-list">

            <div class="asignatura-card"
                 *ngFor="let asig of asignaturasDisponibles"
                 draggable="true"
                 (dragstart)="onDragStartAsignatura($event, asig)">
              <div class="card-top-info">
                <span class="indicator-dot" [style.background-color]="asig.color"></span>
                <span class="asig-nombre">{{ asig.nombre }}</span>
                <svg class="drag-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="9" cy="5" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
              </div>
              <div class="badge-aula" [style.color]="asig.color" [style.background-color]="asig.bgLight">{{ asig.aula }}</div>
              <div class="docente-info">Docente: {{ asig.docente }}</div>
            </div>

          </div>
        </div>

        <!-- PANEL DERECHO: CALENDARIO -->
        <div class="calendar-grid-card">
          <div class="table-responsive">
            <table class="schedule-table">
              <thead>
              <tr>
                <th class="time-col-header"></th>
                <th class="day-header" *ngFor="let d of dias">
                  {{ d.nombre }}<span class="date-sub">{{ d.fecha }}</span>
                </th>
              </tr>
              </thead>
              <tbody>
              <tr *ngFor="let hora of horasBloques">
                <td class="time-cell">{{ hora }}</td>

                <td class="slot-cell"
                    *ngFor="let d of dias"
                    [ngClass]="{
                        'has-event': getClase(d.clave, hora),
                        'drag-over': celdaActiva === d.clave + '|' + hora
                      }"
                    (dragover)="onDragOver($event, d.clave, hora)"
                    (dragleave)="onDragLeave()"
                    (drop)="onDrop($event, d.clave, hora)">

                  <div class="event-pill"
                       *ngIf="getClase(d.clave, hora) as c"
                       [style.border-left-color]="c.color"
                       draggable="true"
                       (dragstart)="onDragStartClase($event, d.clave, hora)">
                    <strong>{{ c.nombre }}</strong>
                    <span>{{ c.aula }} - {{ c.bloque }}</span>
                    <button type="button" class="btn-quitar" (click)="quitarClase(d.clave, hora)" title="Quitar">×</button>
                  </div>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <!-- LEYENDA -->
          <div class="calendar-legend">
            <div class="legend-item" *ngFor="let asig of asignaturasDisponibles">
              <span class="legend-dot" [style.background-color]="asig.color"></span>
              <span class="legend-text">{{ asig.nombre }}</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

</div>

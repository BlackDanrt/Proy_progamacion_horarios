<div class="layout-wrapper">

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="user-avatar-btn" title="Perfil Administrador">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>



    <nav class="sidebar-menu">
      <button type="button" class="sidebar-btn" (click)="navegarA('/inicio-administrador')" title="Panel de control">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/horarios')" title="Horario General / Asignación">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>

      <button type="button" class="sidebar-btn active" (click)="navegarA('/gestion-bases-datos')" title="Gestión de bases de datos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
      </button>
    </nav>

    <div class="sidebar-corner-decor"></div>
  </aside>




  <main class="main-content">
    <div class="form-container">

      <div class="card-panel">
        <div class="card-header">
          <h2 class="card-titulo">Crear Administrador</h2>
          <span class="badge-role">Administrador</span>
        </div>
        <div class="decorador-linea"></div>

        <form class="form-body" (submit)="$event.preventDefault()">

          <div class="form-field">
            <label>Nombre completo</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input type="text" [(ngModel)]="nombreCompleto" name="nombreCompleto" placeholder="Ej: Ing. Carlos Gómez">
            </div>
          </div>

          <div class="form-field">
            <label>Correo institucional</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input type="email" [(ngModel)]="correoInstitucional" name="correoInstitucional" placeholder="ejemplo@unbosque.edu.co">
            </div>
          </div>

          <div class="form-field">
            <label>Carga asignada</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
              </span>
              <input type="text" [(ngModel)]="cargaAsignada" name="cargaAsignada" placeholder="Ej: Gestión Académica / 40 horas">
            </div>
          </div>

          <div class="form-field">
            <label>Especialidad</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
              </span>
              <input type="text" [(ngModel)]="especialidad" name="especialidad" placeholder="Ej: Sistemas e Infraestructura">
            </div>
          </div>

          <div class="form-field">
            <label>Contraseña inicial</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                [type]="mostrarContrasenia ? 'text' : 'password'"
                [(ngModel)]="contrasenia"
                name="contrasenia"
                placeholder="Asignar contraseña">

              <button type="button" class="toggle-password" (click)="toggleMostrarContrasenia()">
                <svg *ngIf="!mostrarContrasenia" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg *ngIf="mostrarContrasenia" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>



          <div class="footer-acciones">
            <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
            <button type="button" class="btn-guardar" (click)="guardarAdministrador()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              <span>Guardar Administrador</span>
            </button>
          </div>

        </form>

      </div>

    </div>
  </main>



  <aside class="right-decor-panel">
    <div class="circle-top-outline"></div>
    <div class="circle-middle-orange"></div>
    <div class="circle-bottom-green"></div>
  </aside>

</div>

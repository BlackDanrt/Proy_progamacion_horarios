<div class="layout-wrapper">


  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="user-menu-container">
        <div
          class="user-avatar-btn"
          title="Perfil Administrador"
          (click)="toggleMenuUsuario($event)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>


        <div class="user-dropdown" *ngIf="mostrarMenuUsuario()" (click)="$event.stopPropagation()">
          <button type="button" class="dropdown-item logout-btn" (click)="cerrarSesion()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>
    </div>


    <nav class="sidebar-menu">
      <button type="button" class="sidebar-btn" (click)="navegarA('/inicio-administrador')" title="Inicio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/horarios')" title="Horario General / Asignación">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/edicion-horarios')" title="Edición de Horarios Guardados">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
      </button>

      <button type="button" class="sidebar-btn active" (click)="navegarA('/gestion-bases-datos')" title="Bases de Datos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/parametros-sistema')" title="Parámetros del sistema">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/auditoria')" title="Auditoría">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path>
          <rect x="9" y="3" width="6" height="4" rx="1" ry="1"></rect>
          <polyline points="9 14 11 16 15 12"></polyline>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/gestion-asignatura')" title="Gestión de asignaturas">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </button>
      <button type="button" class="sidebar-btn" (click)="navegarA('/gestion-aulas')" title="Gestión de Salones">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 21h18"></path>
          <path d="M5 21V7l8-4 8 4v14"></path>
        </svg>
      </button>
    </nav>

    <div class="sidebar-corner-decor"></div>
  </aside>


  <main class="main-content">
    <div class="form-container">

      <div class="card-panel">

        <div class="card-header">
          <h2 class="card-titulo">Crear Administrador</h2>
          <span class="badge-role">Administrador</span>
        </div>

        <div class="decorador-linea"></div>

        <form class="form-body" (ngSubmit)="guardarAdministrador()">


          <div class="form-field">
            <label for="nombre">Nombre</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input id="nombre" type="text" [(ngModel)]="nombre" name="nombre" placeholder="Ej: Carlos" required>
            </div>
          </div>


          <div class="form-field">
            <label for="apellido">Apellido</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
                </svg>
              </span>
              <input id="apellido" type="text" [(ngModel)]="apellido" name="apellido" placeholder="Ej: Gómez" required>
            </div>
          </div>


          <div class="form-field">
            <label for="documento">Documento de identidad</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <circle cx="8" cy="10" r="2"></circle>
                  <path d="M5 16c0-2 6-2 6 0M14 9h5M14 13h5"></path>
                </svg>
              </span>
              <input id="documento" type="number" [(ngModel)]="documento" name="documento" placeholder="Número de documento" min="1" required>
            </div>
          </div>


          <div class="form-field">
            <label for="correo">Correo institucional</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input id="correo" type="email" [(ngModel)]="correo" name="correo" placeholder="ejemplo@unbosque.edu.co" required>
            </div>
          </div>


          <div class="form-field">
            <label for="codigoAdministrador">Código de administrador</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                  <path d="M7 9h10M7 13h6"></path>
                </svg>
              </span>
              <input id="codigoAdministrador" type="text" [(ngModel)]="codigoAdministrador" name="codigoAdministrador" placeholder="Ej: ADM001" required>
            </div>
          </div>


          <div class="form-field">
            <label for="contrasenia">Contraseña inicial</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>

              <input
                id="contrasenia"
                [type]="mostrarContrasenia ? 'text' : 'password'"
                [(ngModel)]="contrasenia"
                name="contrasenia"
                placeholder="Asignar contraseña"
                required>

              <button
                type="button"
                class="toggle-password"
                (click)="toggleMostrarContrasenia()"
                [attr.aria-label]="mostrarContrasenia ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                <svg *ngIf="!mostrarContrasenia" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg *ngIf="mostrarContrasenia" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>


          <div class="form-field">
            <label for="estado">Estado del administrador</label>
            <div class="input-group select-custom-wrapper" [class.estado-activo]="estado === true" [class.estado-inactivo]="estado === false">
              <span class="icon icon-status">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M8 12l3 3 5-6" *ngIf="estado === true"></path>
                  <line x1="15" y1="9" x2="9" y2="15" *ngIf="estado === false"></line>
                  <line x1="9" y1="9" x2="15" y2="15" *ngIf="estado === false"></line>
                </svg>
              </span>

              <select id="estado" [(ngModel)]="estado" name="estado" class="select-estado">
                <option [ngValue]="true">Activo</option>
                <option [ngValue]="false">Inactivo</option>
              </select>

              <span class="status-indicator-badge">
                {{ estado ? 'Habilitado' : 'Deshabilitado' }}
              </span>
            </div>
          </div>


          <div class="footer-acciones">
            <button
              type="button"
              class="btn-cancelar"
              (click)="cancelar()"
              [disabled]="estaCargando">
              Cancelar
            </button>

            <button
              type="submit"
              class="btn-guardar"
              [disabled]="estaCargando">
              <svg *ngIf="!estaCargando" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              <span>{{ estaCargando ? 'Guardando...' : 'Guardar Administrador' }}</span>
            </button>
          </div>

        </form>
      </div>
    </div>
  </main>

  <aside class="right-decor-panel">
    <div class="circle-top-outline"></div>
    <div class="circle-middle-orange"></div>
    <div class="circle-bottom-green"></div>
  </aside>

</div>

<div class="modal-overlay" *ngIf="modalError.visible">
  <div class="modal-error" [ngClass]="modalError.tipo">
    <h3>{{ modalError.titulo }}</h3>
    <p>{{ modalError.mensaje }}</p>
    <button type="button" (click)="modalError.tipo === 'exito' ? volverAGestion() : cerrarModal()">
      Aceptar
    </button>
  </div>
</div>

<div class="layout-wrapper">

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="user-menu-container">
      <div
        class="user-avatar-btn"
        title="Perfil Administrador"
        (click)="toggleMenuUsuario($event)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>

      <div class="user-dropdown" *ngIf="mostrarMenuUsuario" (click)="$event.stopPropagation()">
        <button type="button" class="dropdown-item logout-btn" (click)="cerrarSesion()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
    </div>



    <nav class="sidebar-menu">
      <button type="button" class="sidebar-btn" (click)="navegarA('/inicio-administrador')" title="Inicio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/horarios')" title="Horario General / Asignación">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>

      <button type="button" class="sidebar-btn active" title="Gestión de bases de datos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
      </button>
    </nav>

    <div class="sidebar-corner-decor"></div>
  </aside>

  <main class="main-content">

    <header class="page-header">
      <div class="header-titles">
        <h1>Gestión de bases de datos</h1>
        <p>Administra docentes, roles, especialidades y cargas académicas</p>
      </div>
      <button type="button" class="btn-crear" (click)="crearNuevoRegistro()">
        <span class="plus-icon">+</span>
        <span>Crear Nuevo Registro</span>
      </button>
    </header>

    <div class="search-bar-container">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          [(ngModel)]="filtroBusqueda"
          placeholder="Buscar por nombre, rol o especialidad...">
      </div>
    </div>

    <div class="table-card">
      <table class="data-table">
        <thead>
        <tr>
          <th class="th-sortable">
            <span>Nombre</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
          </th>
          <th class="th-sortable">
            <span>Rol</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
          </th>
          <th class="th-sortable">
            <span>Especialidad</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
          </th>
          <th class="th-sortable">
            <span>Carga Asignada</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
          </th>
          <th class="th-actions">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let reg of registrosFiltrados">
          <td class="td-nombre">{{ reg.nombre }}</td>
          <td>
            <span class="badge-role" [class.badge-docente]="reg.rol === 'Docente'" [class.badge-admin]="reg.rol === 'Administrador'">
              {{ reg.rol }}
            </span>
          </td>
          <td class="td-especialidad">{{ reg.especialidad }}</td>
          <td class="td-carga">{{ reg.cargaAsignada }}</td>
          <td class="td-actions">
            <div class="actions-group">
              <button
                type="button"
                class="btn-action btn-view"
                *ngIf="reg.rol === 'Docente'"
                title="Visualizar Horario"
                (click)="visualizarHorario(reg.id)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>

              <button type="button" class="btn-action btn-edit" title="Actualizar" (click)="actualizarRegistro(reg.id)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>

              <button type="button" class="btn-action btn-delete" title="Eliminar" (click)="eliminarRegistro(reg.id)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <footer class="pagination-footer">
      <div class="records-selector">
        <span>Mostrar</span>
        <select [(ngModel)]="registrosPorPagina" class="select-per-page">
          <option [value]="10">10</option>
          <option [value]="25">25</option>
          <option [value]="50">50</option>
        </select>
        <span>registros por página</span>
      </div>

      <div class="pagination-controls">
        <button
          type="button"
          *ngFor="let p of paginas"
          class="page-btn"
          [class.active]="p === paginaActual"
          (click)="cambiarPagina(p)">
          {{ p }}
        </button>
        <button type="button" class="page-btn next-btn" (click)="cambiarPagina(paginaActual + 1)">
          &gt;
        </button>
      </div>
    </footer>

  </main>

  <app-seleccion-crear-registro
    *ngIf="mostrarModalRegistro"
    (cerrar)="cerrarModalRegistro()">
  </app-seleccion-crear-registro>

</div>

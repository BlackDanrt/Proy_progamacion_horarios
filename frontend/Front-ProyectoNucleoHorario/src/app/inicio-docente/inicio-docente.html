<div class="layout-wrapper">
  <!-- BARRA LATERAL (SIDEBAR DOCENTE) -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="user-menu-container">
        <div class="user-avatar-btn" title="Perfil Docente" (click)="toggleMenuUsuario($event)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>

        <div class="user-dropdown" *ngIf="mostrarMenuUsuario" (click)="$event.stopPropagation()">
          <button type="button" class="dropdown-item logout-btn" (click)="cerrarSesion()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>
    </div>

    <!-- NAVEGACIÓN DOCENTE -->
    <nav class="sidebar-menu">
      <button type="button" class="sidebar-btn active" (click)="navegarA('/inicio-docente')" title="Inicio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>
      <button type="button" class="sidebar-btn" (click)="navegarA('/mi-horario')" title="Mi horario">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <polyline points="8 15 11 18 16 12"></polyline>
        </svg>
      </button>
    </nav>
    <div class="sidebar-corner-decor"></div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <div class="dashboard-container">

      <!-- SOLO EL NOMBRE -->
      <section class="welcome-card">
        <div class="welcome-text">
          <h1>¡Bienvenido, {{ nombreDocente }}!</h1>
        </div>
      </section>

      <!-- PREGUNTA Y ÚNICA TARJETA -->
      <h2 class="section-title">¿Qué deseas gestionar hoy?</h2>
      <section class="modules-grid">
        <div class="module-card" *ngFor="let item of accesosDirectos" (click)="ejecutarAccion(item)">
          <div class="module-header">
            <span class="module-badge">{{ item.badge }}</span>
          </div>
          <h3>{{ item.titulo }}</h3>
          <p>{{ item.descripcion }}</p>
          <div class="module-footer">
            <span>Acceder al módulo</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </div>
      </section>

    </div>
  </main>

  <aside class="right-decor-panel">
    <div class="circle-top-outline"></div>
    <div class="circle-middle-orange"></div>
    <div class="circle-bottom-green"></div>
  </aside>
</div>

<div class="login-container">

  <div class="left-panel" [style.background-image]="'url(' + imagenCampus + ')'">
    <div class="overlay-gradient"></div>
  </div>

  <div class="right-panel">
    <div class="login-card">

      <div class="header-logo">
        <img [src]="logoUniversidad" alt="Universidad El Bosque" class="logo-universidad">
      </div>

      <h1 class="titulo-portal">Bienvenido al portal universitario</h1>
      <p class="subtitulo">Accede con tus credenciales institucionales</p>

      <div class="tabs-container">
        <button
          class="tab-btn"
          [class.active]="pestanaActiva === 'docente'"
          (click)="cambiarPestana('docente')">
          Ingreso Docente
        </button>
        <button
          class="tab-btn"
          [class.active]="pestanaActiva === 'administrador'"
          (click)="cambiarPestana('administrador')">
          Ingreso Administrador
        </button>
      </div>

      <form class="formulario" (submit)="$event.preventDefault()">

        <div class="input-group">
          <span class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" placeholder="Correo institucional">
        </div>

        <div class="input-group">
          <span class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>

          <input [type]="mostrarContrasenia ? 'text' : 'password'" placeholder="Contraseña">

          <button type="button" class="toggle-password" (click)="toggleMostrarContrasenia()">
            <svg *ngIf="!mostrarContrasenia" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>

            <svg *ngIf="mostrarContrasenia" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <div class="forgot-password">
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="button" class="btn-submit">
          Iniciar sesión
        </button>

      </form>

      <div class="footer-divider">
        <div class="linea"></div>
        <img [src]="escudoUniversidad" alt="Escudo El Bosque" class="escudo">
        <div class="linea"></div>
      </div>
    </div>
  </div>

</div>

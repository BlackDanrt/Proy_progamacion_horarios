<div class="layout-wrapper">

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="user-menu-container">
        <div
          class="user-avatar-btn"
          title="Perfil Administrador"
          (click)="toggleMenuUsuario($event)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>

        <div class="user-dropdown" *ngIf="mostrarMenuUsuario" (click)="$event.stopPropagation()">
          <button type="button" class="dropdown-item logout-btn" (click)="cerrarSesion()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>
    </div>

    <nav class="sidebar-menu">
      <button type="button" class="sidebar-btn" (click)="navegarA('/inicio-administrador')" title="Inicio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/horarios')" title="Horario General / Asignación">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/gestion-bases-datos')" title="Bases de Datos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
      </button>

      <button type="button" class="sidebar-btn active" title="Parámetros del sistema">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </nav>

    <button type="button" class="sidebar-btn" (click)="navegarA('/auditoria')" title="Auditoría">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path>
        <rect x="9" y="3" width="6" height="4" rx="1" ry="1"></rect>
        <polyline points="9 14 11 16 15 12"></polyline>
      </svg>
    </button>

    <div class="sidebar-corner-decor"></div>
  </aside>

  <main class="main-content">
    <div class="registro-container">

      <div class="banner" *ngIf="mensaje"
           [class.banner-exito]="mensaje.tipo === 'exito'"
           [class.banner-error]="mensaje.tipo === 'error'">
        <span>{{ mensaje.texto }}</span>
        <button type="button" class="banner-cerrar" (click)="mensaje = null">×</button>
      </div>

      <!-- JORNADAS Y HORARIOS -->
      <div class="card-panel">
        <h2 class="card-titulo">Jornadas y horarios</h2>
        <div class="decorador-linea"></div>

        <p class="texto-ayuda" *ngIf="cargando">Cargando parámetros...</p>

        <form class="grid-form" *ngIf="!cargando" (submit)="$event.preventDefault()">

          <div class="form-field">
            <label>Hora inicio entre semana</label>
            <div class="input-group sin-icono">
              <input type="time" [(ngModel)]="horaInicioEntreSemana" name="horaInicioEntreSemana">
            </div>
          </div>

          <div class="form-field">
            <label>Hora fin entre semana</label>
            <div class="input-group sin-icono">
              <input type="time" [(ngModel)]="horaFinEntreSemana" name="horaFinEntreSemana">
            </div>
          </div>

          <div class="form-field">
            <label>Hora inicio sábado</label>
            <div class="input-group sin-icono">
              <input type="time" [(ngModel)]="horaInicioSabado" name="horaInicioSabado">
            </div>
          </div>

          <div class="form-field">
            <label>Hora fin sábado</label>
            <div class="input-group sin-icono">
              <input type="time" [(ngModel)]="horaFinSabado" name="horaFinSabado">
            </div>
          </div>

          <div class="form-field">
            <label>Hora inicio almuerzo</label>
            <div class="input-group sin-icono">
              <input type="time" [(ngModel)]="horaInicioAlmuerzo" name="horaInicioAlmuerzo">
            </div>
          </div>

          <div class="form-field">
            <label>Hora fin almuerzo</label>
            <div class="input-group sin-icono">
              <input type="time" [(ngModel)]="horaFinAlmuerzo" name="horaFinAlmuerzo">
            </div>
          </div>

        </form>
      </div>

      <!-- REGLAS DE GRUPOS Y SESIONES -->
      <div class="card-panel" *ngIf="!cargando">
        <h2 class="card-titulo">Reglas de grupos y sesiones</h2>
        <div class="decorador-linea"></div>

        <form class="grid-form" (submit)="$event.preventDefault()">

          <div class="form-field">
            <label>Sesiones máximas por semana</label>
            <div class="input-group sin-icono">
              <input type="number" [(ngModel)]="maxSesionesPorSemana" name="maxSesionesPorSemana" min="1">
            </div>
          </div>

          <div class="form-field">
            <label>Duración de la sesión (minutos)</label>
            <div class="input-group sin-icono">
              <input type="number" [(ngModel)]="duracionSesionMinutos" name="duracionSesionMinutos" min="1">
            </div>
          </div>

          <div class="form-field">
            <label>Capacidad máxima del grupo</label>
            <div class="input-group sin-icono">
              <input type="number" [(ngModel)]="capacidadMaximaGrupo" name="capacidadMaximaGrupo" min="1">
            </div>
          </div>

          <div class="form-field">
            <label>Tolerancia de capacidad (%)</label>
            <div class="input-group sin-icono">
              <input type="number" [(ngModel)]="toleranciaCapacidad" name="toleranciaCapacidad" min="0" max="100">
            </div>
          </div>

          <div class="form-field">
            <label>Mínimo de estudiantes para abrir grupo</label>
            <div class="input-group sin-icono">
              <input type="number" [(ngModel)]="minEstudiantesParaAbrir" name="minEstudiantesParaAbrir" min="1">
            </div>
          </div>

          <div class="form-field">
            <label>Exigir días no consecutivos</label>
            <label class="toggle-switch">
              <input type="checkbox" [(ngModel)]="exigirDiasNoConsecutivos" name="exigirDiasNoConsecutivos">
              <span class="toggle-slider"></span>
            </label>
          </div>

        </form>

        <div class="footer-acciones">
          <button type="button" class="btn-guardar" [disabled]="guardando" (click)="guardar()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>{{ guardando ? 'Guardando...' : 'Guardar parámetros' }}</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <aside class="right-decor-panel">
    <div class="circle-top-outline"></div>
    <div class="circle-middle-orange"></div>
    <div class="circle-bottom-green"></div>
  </aside>

</div>

<div class="layout-wrapper">

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="user-avatar-btn" [title]="esAdministrador ? 'Perfil Administrador' : 'Perfil Docente'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>

    <!-- Menú del administrador -->
    <nav class="sidebar-menu" *ngIf="esAdministrador">
      <button type="button" class="sidebar-btn" (click)="navegarA('/inicio-administrador')" title="Inicio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>

      <button type="button" class="sidebar-btn" (click)="navegarA('/horarios')" title="Horario General / Asignación">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>

      <button type="button" class="sidebar-btn active" (click)="navegarA('/gestion-bases-datos')" title="Bases de Datos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
      </button>
    </nav>

    <!-- Menú del docente -->
    <nav class="sidebar-menu" *ngIf="!esAdministrador">
      <!-- Registro de disponibilidad (pantalla actual) -->
      <button type="button" class="sidebar-btn active" title="Registro de disponibilidad">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>

      <!-- Consultar mi horario -->
      <button type="button" class="sidebar-btn" (click)="navegarA('/mi-horario')" title="Consultar mi horario">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <polyline points="8 15 11 18 16 12"></polyline>
        </svg>
      </button>
    </nav>

    <div class="sidebar-corner-decor"></div>
  </aside>

  <main class="main-content">
    <div class="registro-container">

      <div class="card-panel">
        <h2 class="card-titulo">
          {{ esAdministrador ? 'Registro de profesor por Administrador' : 'Registro de profesor' }}
        </h2>
        <div class="decorador-linea"></div>

        <form class="grid-form" (submit)="$event.preventDefault()">

          <!-- Nombre Completo -->
          <div class="form-field">
            <label>Nombre completo</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input type="text" [(ngModel)]="nombreCompleto" name="nombreCompleto" placeholder="Ej: Dr. Carlos Mendoza">
            </div>
          </div>

          <!-- Correo Institucional -->
          <div class="form-field">
            <label>Correo institucional</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input type="email" [(ngModel)]="correoInstitucional" name="correoInstitucional" placeholder="ejemplo@unbosque.edu.co">
            </div>
          </div>

          <div class="form-field">
            <label>Especialidad</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
              </span>
              <input type="text" [(ngModel)]="especialidad" name="especialidad" placeholder="Ej: Ingeniería de Software">
            </div>
          </div>

          <div class="form-field">
            <label>Tipo de vinculación</label>
            <div class="input-group select-group">
              <select [(ngModel)]="tipoVinculacion" name="tipoVinculacion">
                <option *ngFor="let opcion of opcionesVinculacion" [value]="opcion">
                  {{ opcion }}
                </option>
              </select>
              <span class="chevron-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
            </div>
          </div>

          <div class="form-field form-field-full" *ngIf="esAdministrador">
            <label>Crear contraseña para el docente</label>
            <div class="input-group">
              <span class="icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                [(ngModel)]="contrasenia"
                name="contrasenia"
                placeholder="Asigna una contraseña al docente">
            </div>
          </div>

        </form>
      </div>

      <div class="card-panel">
        <h2 class="card-titulo">Disponibilidad horaria semanal</h2>
        <div class="decorador-linea"></div>

        <div class="horario-toolbar">
          <div class="fecha-selector">
            <button type="button" class="btn-nav" (click)="cambiarSemana(-1)" title="Semana anterior">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>

            <div class="fecha-badge-container">
              <label class="fecha-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>{{ rangoSemanaTexto }}</span>

                <input
                  type="date"
                  class="input-date-hidden"
                  [value]="fechaInputPicker"
                  (change)="alSeleccionarFecha($event)">
              </label>
            </div>

            <button type="button" class="btn-nav" (click)="cambiarSemana(1)" title="Semana siguiente">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>

          <div class="convenciones">
            <div class="item-convencion">
              <span class="box-disponible"></span>
              <span>Disponible</span>
            </div>
            <div class="item-convencion">
              <span class="box-seleccionado"></span>
              <span>Seleccionado</span>
            </div>
          </div>
        </div>

        <div class="tabla-container">
          <table class="tabla-horario">
            <thead>
            <tr>
              <th class="th-hora">Hora</th>
              <th *ngFor="let dia of diasSemana">{{ dia }}</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let h of horas; let hIdx = index">
              <td class="td-hora">{{ h.horaInicio }} – {{ h.horaFin }}</td>
              <td
                *ngFor="let dia of diasSemana; let dIdx = index"
                class="td-bloque"
                [class.bloque-deshabilitado]="h.esAlmuerzo"
                (click)="toggleCelda(dIdx, hIdx)">
                <div
                  *ngIf="!h.esAlmuerzo"
                  class="bloque-slot"
                  [class.activo]="isCeldaSeleccionada(dIdx, hIdx)">
                </div>
                <span *ngIf="h.esAlmuerzo" class="texto-almuerzo">Almuerzo</span>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <div class="footer-acciones">
          <button type="button" class="btn-guardar" (click)="guardarDisponibilidad()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>Guardar registro</span>
          </button>
        </div>

      </div>

    </div>
  </main>

  <aside class="right-decor-panel">
    <div class="circle-top-outline"></div>
    <div class="circle-middle-orange"></div>
    <div class="circle-bottom-green"></div>
  </aside>

</div>
